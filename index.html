<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smatu Global | Premium Dashboard</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --secondary: #3b82f6; --bg: #030712; --card: rgba(255,255,255,0.03); --sidebar: rgba(15, 23, 42, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: #030712; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; }
        .glow { position: fixed; width: 300px; height: 300px; background: var(--primary); filter: blur(150px); opacity: 0.15; z-index: -1; border-radius: 50%; }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: -100px; right: -100px; background: var(--secondary); }
        .sidebar { width: 260px; background: var(--sidebar); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 30px 20px; transition: 0.3s; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 700; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; background: linear-gradient(to right, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { padding: 14px 18px; border-radius: 12px; color: rgba(255,255,255,0.6); text-decoration: none; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; transition: 0.3s; cursor: pointer; font-size: 0.95rem; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-link.active { background: rgba(139,92,246,0.15); color: #8b5cf6; border: 1px solid rgba(139,92,246,0.2); }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
        .tab-content { display: none; max-width: 800px; animation: slideIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        #setup-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .setup-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(30px); padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; text-align: center; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h2 { font-size: 1.2rem; margin-bottom: 20px; opacity: 0.9; }
        input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none; transition: 0.3s; margin-bottom: 15px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(to right, #8b5cf6, #3b82f6); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.1); }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; padding: 15px; flex-direction: row; overflow-x: auto; } .logo { display: none; } .nav-link { margin-bottom: 0; padding: 10px 15px; font-size: 0.8rem; white-space: nowrap; } .main-content { padding: 20px; } }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div id="setup-overlay">
        <div class="setup-card">
            <h1>SMATU GLOBAL</h1>
            <p style="margin-bottom:25px; opacity:0.6;">Secure Coupling Mode</p>
            <input type="text" id="deviceIdInput" placeholder="Device ID (e.g. 12ab34cd)">
            <input type="password" id="pinInput" placeholder="Security PIN" maxlength="4">
            <button class="btn" onclick="savePairing()">Coupled Securely</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="logo">SMATU <span>👁️</span></div>
        <div class="nav-link active" onclick="showTab('chat', this)"><span>💬</span> Messaging</div>
        <div class="nav-link" onclick="showTab('alarms', this)"><span>⏰</span> Remote Alarms</div>
        <div class="nav-link" onclick="showTab('presets', this)"><span>✨</span> Local Presets</div>
        <div class="nav-link" onclick="showTab('system', this)"><span>⚙️</span> System Settings</div>
        
        <div style="margin-top:auto; padding:15px; background:rgba(255,255,255,0.03); border-radius:15px;">
            <p style="font-size:0.7rem; opacity:0.4; margin-bottom:10px;">DEVICE STATUS</p>
            <div class="status-pill" id="cloud-status" style="background:rgba(16,185,129,0.1); color:#10b981;">
                <span id="status-text">Connecting...</span>
            </div>
            <p id="remote-state" style="font-size:0.75rem; margin-top:10px; opacity:0.8;">Syncing...</p>
        </div>
    </div>

    <div class="main-content">
        <div id="tab-chat" class="tab-content active">
            <h2>Send Message</h2>
            <div class="card">
                <input type="text" id="msgInput" placeholder="Type something..." maxlength="20" style="margin-bottom:15px; font-size:1.2rem; padding:20px;">
                <button class="btn" id="deliverBtn" onclick="sendMsg()">Deliver Message</button>
            </div>
            
            <h2 style="margin-top:40px; color:#10b981;">Incoming from Partner</h2>
            <div id="partner-msg" class="card" style="border: 1px solid rgba(16,185,129,0.2); background: rgba(16,185,129,0.05); text-align:center; font-size:1.3rem; padding:40px;">
                No messages yet.
            </div>
        </div>

        <div id="tab-alarms" class="tab-content">
            <h2>Remote Alarms</h2>
            <div class="card" id="alarm-container"></div>
        </div>

        <div id="tab-presets" class="tab-content">
            <h2>Global Presets</h2>
            <div class="card">
                <label>Preset 1</label><input type="text" id="p0" placeholder="e.g. Call Me!">
                <label>Preset 2</label><input type="text" id="p1" placeholder="e.g. Come Home">
                <button class="btn" style="margin-top:20px;" onclick="savePresets()">Sync Presets</button>
            </div>
        </div>

        <div id="tab-system" class="tab-content">
            <h2>Security</h2>
            <div class="card">
                <p style="opacity:0.6; margin-bottom:20px;">ID: <strong id="displayId">---</strong></p>
                <button class="btn" style="background:rgba(239,68,68,0.15); color:#ef4444;" onclick="unpair()">Unpair</button>
            </div>
        </div>
    </div>

    <script>
        let deviceId = localStorage.getItem('smatu_device_id');
        let pin = localStorage.getItem('smatu_pin');
        const statusText = document.getElementById('status-text');
        const statusPill = document.getElementById('cloud-status');
        
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { connectTimeout: 4000, reconnectPeriod: 1000 });

        client.on('connect', () => {
            statusPill.style.color = "#10b981";
            statusText.innerText = "Cloud Active";
            if(deviceId) {
                client.subscribe(`smatu/status/${deviceId}`);
                client.subscribe(`smatu/device/${deviceId}`);
            }
        });

        client.on('message', (topic, message) => {
            const raw = message.toString();
            if(topic === `smatu/status/${deviceId}`) {
                const data = JSON.parse(raw);
                const states = ["Idle Eyes", "Digital Watch", "Showing Message", "Connecting"];
                document.getElementById('remote-state').innerText = "Device is: " + states[data.state];
            } else if(topic === `smatu/device/${deviceId}`) {
                const display = document.getElementById('partner-msg');
                display.innerText = raw;
                display.style.animation = 'none';
                display.offsetHeight; 
                display.style.animation = 'pulse 1s ease';
                // Beep sound on mobile if possible
                if(window.navigator.vibrate) window.navigator.vibrate(200);
            }
        });

        if(deviceId && pin) {
            document.getElementById('setup-overlay').style.display='none';
            document.getElementById('displayId').innerText = deviceId;
            renderAlarms();
        }

        function savePairing() {
            const id = document.getElementById('deviceIdInput').value.trim().toLowerCase();
            const p = document.getElementById('pinInput').value.trim();
            if(id && p) {
                localStorage.setItem('smatu_device_id', id);
                localStorage.setItem('smatu_pin', p);
                location.reload();
            }
        }

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            el.classList.add('active');
        }

        function sendMsg() {
            const val = document.getElementById('msgInput').value;
            if(val) { publish(val); document.getElementById('msgInput').value=''; }
        }

        function renderAlarms() {
            let html = '';
            for(let i=0; i<5; i++) {
                html += `<div style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.02); padding:12px; border-radius:12px; margin-bottom:10px;">
                    <input type="number" id="h${i}" value="00" style="width:50px; background:none; border:1px solid rgba(255,255,255,0.1); color:white; text-align:center;"> : 
                    <input type="number" id="m${i}" value="00" style="width:50px; background:none; border:1px solid rgba(255,255,255,0.1); color:white; text-align:center;">
                    <input type="checkbox" id="a${i}" style="margin-left:auto;">
                    <button class="btn" style="width:auto; padding:8px 15px; font-size:0.75rem;" onclick="saveAlarm(${i})">Sync</button>
                </div>`;
            }
            document.getElementById('alarm-container').innerHTML = html;
        }

        function saveAlarm(i) {
            const h = document.getElementById('h'+i).value;
            const m = document.getElementById('m'+i).value;
            const a = document.getElementById('a'+i).checked;
            publish(JSON.stringify({type: "alarm", i: i, h: parseInt(h), m: parseInt(m), a: a, pin: pin}));
        }

        function savePresets() {
            for(let i=0; i<2; i++) {
                const v = document.getElementById('p'+i).value;
                if(v) publish(JSON.stringify({type: "preset", i: i, v: v, pin: pin}));
            }
        }

        function unpair() { if(confirm("Unpair?")) { localStorage.clear(); location.reload(); } }

        function publish(msg) {
            if(!client.connected) { alert("Offline!"); return; }
            client.publish(`smatu/app/${deviceId}`, msg, { qos: 1 });
        }
    </script>
    <style>
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); background: rgba(16,185,129,0.2); } 100% { transform: scale(1); } }
    </style>
</body>
</html>
