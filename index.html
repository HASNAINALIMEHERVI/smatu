<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smatu Global Controller</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --secondary: #3b82f6; --bg: #0f172a; --card: rgba(255,255,255,0.05); --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .container { width: 100%; max-width: 450px; background: var(--card); backdrop-filter: blur(20px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 40px 80px rgba(0,0,0,0.6); position: relative; }
        
        #setup-screen { display: block; text-align: center; }
        #app-screen { display: none; }

        h1 { font-size: 1.5rem; margin-bottom: 20px; background: linear-gradient(to right, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600; }
        
        nav { display: flex; background: rgba(255,255,255,0.03); border-radius: 15px; padding: 5px; margin-bottom: 25px; gap: 5px; }
        .nav-btn { flex: 1; padding: 10px; border: none; background: none; color: rgba(255,255,255,0.5); font-size: 0.8rem; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .nav-btn.active { background: rgba(139,92,246,0.15); color: white; }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-box { width: 100%; padding: 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 1rem; margin-bottom: 15px; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: var(--primary); }

        .main-btn { width: 100%; padding: 15px; background: linear-gradient(to right, #8b5cf6, #3b82f6); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(139,92,246,0.3); }

        /* Alarm Row */
        .alarm-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .alarm-row input[type="number"] { width: 60px; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; text-align: center; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block; margin-right: 5px; }
        .edit-id { font-size: 0.7rem; opacity: 0.3; margin-top: 20px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Setup -->
        <div id="setup-screen">
            <h1>Smatu Global</h1>
            <p style="font-size:0.8rem; opacity:0.6; margin-bottom:20px;">Enter your Unique Device ID to connect</p>
            <input type="text" id="deviceIdInput" class="input-box" placeholder="Device ID (e.g. 12ab34cd)">
            <button class="main-btn" onclick="saveId()">Connect Device</button>
        </div>

        <!-- Dashboard -->
        <div id="app-screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <span style="font-size:0.7rem; opacity:0.5;" id="displayId">ID: ---</span>
                <span style="font-size:0.7rem; color:#10b981;"><span class="status-dot"></span>Cloud Active</span>
            </div>

            <nav>
                <button class="nav-btn active" onclick="showTab('chat')">Chat</button>
                <button class="nav-btn" onclick="showTab('alarms')">Alarms</button>
                <button class="nav-btn" onclick="showTab('presets')">Presets</button>
            </nav>

            <!-- Chat Tab -->
            <div id="tab-chat" class="tab-content active">
                <input type="text" id="msgInput" class="input-box" placeholder="Type a message..." maxlength="20">
                <button class="main-btn" onclick="sendMsg()">Send Message</button>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:15px;">
                    <button class="nav-btn" style="background:rgba(255,255,255,0.05); color:white;" onclick="publish('I Love You! ❤️')">I Love You!</button>
                    <button class="nav-btn" style="background:rgba(255,255,255,0.05); color:white;" onclick="publish('Miss You! 🥺')">Miss You!</button>
                </div>
            </div>

            <!-- Alarms Tab -->
            <div id="tab-alarms" class="tab-content">
                <h3 style="font-size:0.9rem; margin-bottom:15px; opacity:0.8;">Remote Alarm Manager</h3>
                <div id="alarm-list">
                    <!-- 5 Alarms -->
                    <script>
                        for(let i=0; i<5; i++) {
                            document.write(`<div class="alarm-row">
                                <span style="opacity:0.4; font-size:0.8rem;">#${i+1}</span>
                                <input type="number" id="h${i}" min="0" max="23" value="00">
                                <span>:</span>
                                <input type="number" id="m${i}" min="0" max="59" value="00">
                                <input type="checkbox" id="a${i}" style="margin-left:auto;">
                                <button onclick="saveAlarm(${i})" style="padding:5px 10px; font-size:0.7rem; background:rgba(139,92,246,0.2); border:none; color:white; border-radius:5px; cursor:pointer;">Set</button>
                            </div>`);
                        }
                    </script>
                </div>
                <p style="font-size:0.6rem; opacity:0.4; text-align:center; margin-top:10px;">Alarms are saved directly to the device via Cloud.</p>
            </div>

            <!-- Presets Tab -->
            <div id="tab-presets" class="tab-content">
                <h3 style="font-size:0.9rem; margin-bottom:15px; opacity:0.8;">Edit Local Presets</h3>
                <input type="text" id="p0" class="input-box" placeholder="Preset 1">
                <input type="text" id="p1" class="input-box" placeholder="Preset 2">
                <button class="main-btn" onclick="savePresets()">Save All Presets</button>
            </div>

            <div class="edit-id" onclick="resetId()">Change Device ID</div>
        </div>
    </div>

    <script>
        let deviceId = localStorage.getItem('smatu_device_id');
        const client = mqtt.connect('wss://broker.hivemq.com:8000/mqtt');

        if(deviceId) showApp();

        function saveId() {
            let id = document.getElementById('deviceIdInput').value.trim();
            if(id) { localStorage.setItem('smatu_device_id', id); deviceId = id; showApp(); }
        }

        function showApp() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('displayId').innerText = "ID: " + deviceId;
        }

        function resetId() { if(confirm("Reset ID?")) { localStorage.removeItem('smatu_device_id'); location.reload(); } }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function sendMsg() {
            const m = document.getElementById('msgInput').value;
            if(m) { publish(m); document.getElementById('msgInput').value = ""; }
        }

        function saveAlarm(i) {
            const h = document.getElementById('h'+i).value;
            const m = document.getElementById('m'+i).value;
            const a = document.getElementById('a'+i).checked;
            const payload = JSON.stringify({type: "alarm", i: i, h: parseInt(h), m: parseInt(m), a: a});
            publish(payload);
        }

        function savePresets() {
            for(let i=0; i<2; i++) { // Just 2 for example, can add more
                const v = document.getElementById('p'+i).value;
                if(v) publish(JSON.stringify({type: "preset", i: i, v: v}));
            }
        }

        function publish(msg) {
            client.publish(`smatu/app/${deviceId}`, msg);
            console.log("Sent:", msg);
        }
    </script>
</body>
</html>
